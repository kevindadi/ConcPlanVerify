# ══════════════════════════════════════════════════════════════
#  CIR+CVN Experiment Configuration
# ══════════════════════════════════════════════════════════════
#
# API keys are read from the environment (see .env):
#   ALL_API_KEY       — aggregator at z.apiyihe.org (GPT-5, Claude 4.7 Opus, Gemini 3 Pro)
#   DEEPSEEK_API_KEY  — DeepSeek first-party API (DeepSeek-V3)
#   DASHSCOPE_API_KEY — Alibaba Cloud DashScope (Qwen3-235B-A22B)

[experiment]
max_gen_rounds    = 5        # RQ1: max CIR generation iterations
max_repair_rounds = 5        # RQ2: max repair loop iterations
temperature       = 0.0
max_tokens        = 4096
patterns_dir      = "tests/e2e"
source_dir        = "experiments/source_programs"
output_dir        = "experiments/results"
runs_per_pattern  = 3        # repeat each experiment for averaging

# ── Source programs for RQ1 ───────────────────────────────────
# Each entry maps a pattern name to its Rust source file.
# The script sends these to the LLM for CIR generation.
[source_programs]
mutex_deadlock       = "experiments/source_programs/mutex_deadlock.rs"
signal_loss          = "experiments/source_programs/signal_loss.rs"
channel_deadlock     = "experiments/source_programs/channel_deadlock.rs"
three_way_deadlock   = "experiments/source_programs/three_way_deadlock.rs"
semaphore_throttle   = "experiments/source_programs/semaphore_throttle.rs"
cas_race             = "experiments/source_programs/cas_race.rs"
condvar_spurious     = "experiments/source_programs/condvar_spurious.rs"
dual_condvar         = "experiments/source_programs/dual_condvar.rs"
partial_deadlock     = "experiments/source_programs/partial_deadlock.rs"
fn_summary_prop      = "experiments/source_programs/fn_summary_prop.rs"

# ── Buggy CIR files for RQ2 ──────────────────────────────────
# Each entry maps a pattern name to its ground-truth buggy CIR JSON.
[buggy_cirs]
mutex_deadlock       = "tests/e2e/mutex_deadlock/buggy.json"
signal_loss          = "tests/e2e/signal_loss/buggy.json"
channel_deadlock     = "tests/e2e/channel_deadlock/buggy.json"
three_way_deadlock   = "tests/e2e/three_way_deadlock/buggy.json"
dual_condvar         = "tests/e2e/dual_condvar/buggy.json"
partial_deadlock     = "tests/e2e/partial_deadlock/buggy.json"

# ── Fixed / baseline CIR files for RQ4 goal reachability ─────
# Each entry maps a pattern name to its repaired / baseline CIR JSON.
# Patterns without declared business goals contribute `goals_total == 0`.
[fixed_cirs]
mutex_deadlock       = "tests/e2e/mutex_deadlock/fixed.json"
channel_deadlock     = "tests/e2e/channel_deadlock/fixed.json"
three_way_deadlock   = "tests/e2e/three_way_deadlock/fixed.json"
semaphore_throttle   = "tests/e2e/semaphore_throttle/buggy.json"  # baseline, no bug
cas_race             = "tests/e2e/cas_race/buggy.json"            # baseline, no bug
dual_condvar         = "tests/e2e/dual_condvar/fixed.json"
partial_deadlock     = "tests/e2e/partial_deadlock/fixed.json"
fn_summary_prop      = "tests/e2e/fn_summary_prop/fixed.json"

# ── Model Definitions ─────────────────────────────────────────
# Paper's five evaluation models. Four route through the z.apiyihe.org
# OpenAI-compatible aggregator (using ALL_API_KEY); Qwen uses DashScope.

[[models]]
name        = "gpt-5"
provider    = "openai"
model_id    = "gpt-5"
api_key_env = "ALL_API_KEY"
base_url    = "https://z.apiyihe.org/v1"

[[models]]
# NOTE: We use claude-opus-4-7 rather than -4-6 on this aggregator because
# the -4-6 channel inlines <think>...</think> blocks into message.content,
# which corrupts downstream JSON parsing. The -4-7 channel returns clean
# content with reasoning hidden from the transport layer.
name        = "claude-4.7-opus"
provider    = "openai"
model_id    = "claude-opus-4-7"
api_key_env = "ALL_API_KEY"
base_url    = "https://z.apiyihe.org/v1"

[[models]]
name        = "gemini-3-pro"
provider    = "openai"
model_id    = "gemini-3-pro"
api_key_env = "ALL_API_KEY"
base_url    = "https://z.apiyihe.org/v1"

[[models]]
# DeepSeek goes direct (not via z.apiyihe aggregator): the first-party
# endpoint is more reliable and avoids aggregator cold-start timeouts.
name        = "deepseek-v3"
provider    = "openai"
model_id    = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
base_url    = "https://api.deepseek.com/v1"

[[models]]
name        = "qwen3-235b-a22b"
provider    = "openai"                  # DashScope is OpenAI-compatible
model_id    = "qwen3-235b-a22b"
api_key_env = "DASHSCOPE_API_KEY"
base_url    = "https://dashscope.aliyuncs.com/compatible-mode/v1"
