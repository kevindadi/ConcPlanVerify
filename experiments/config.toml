# ══════════════════════════════════════════════════════════════
#  CIR+CVN Experiment Configuration
# ══════════════════════════════════════════════════════════════
#
# Fill in the API keys (or set the corresponding env vars) and
# uncomment the models you want to evaluate.

[experiment]
max_gen_rounds   = 5        # RQ1: max CIR generation iterations
max_repair_rounds = 5       # RQ2: max repair loop iterations
temperature      = 0.0
max_tokens       = 4096
patterns_dir     = "tests/e2e"
source_dir       = "experiments/source_programs"
output_dir       = "experiments/results"
runs_per_pattern = 3        # repeat each experiment for averaging

# ── Source programs for RQ1 ───────────────────────────────────
# Each entry maps a pattern name to its Rust source file.
# The script sends these to the LLM for CIR generation.
[source_programs]
mutex_deadlock       = "experiments/source_programs/mutex_deadlock.rs"
signal_loss          = "experiments/source_programs/signal_loss.rs"
channel_deadlock     = "experiments/source_programs/channel_deadlock.rs"
three_way_deadlock   = "experiments/source_programs/three_way_deadlock.rs"
semaphore_throttle   = "experiments/source_programs/semaphore_throttle.rs"
cas_race             = "experiments/source_programs/cas_race.rs"
rwlock_starvation    = "experiments/source_programs/rwlock_starvation.rs"
condvar_spurious     = "experiments/source_programs/condvar_spurious.rs"
dual_condvar         = "experiments/source_programs/dual_condvar.rs"
fn_summary           = "experiments/source_programs/fn_summary.rs"

# ── Buggy CIR files for RQ2 ──────────────────────────────────
# Each entry maps a pattern name to its ground-truth buggy CIR JSON.
[buggy_cirs]
mutex_deadlock       = "tests/e2e/mutex_deadlock/buggy.json"
signal_loss          = "tests/e2e/signal_loss/buggy.json"
channel_deadlock     = "tests/e2e/channel_deadlock/buggy.json"
three_way_deadlock   = "tests/e2e/three_way_deadlock/buggy.json"
rwlock_starvation    = "tests/e2e/rwlock_starvation/buggy.json"
condvar_spurious     = "tests/e2e/condvar_spurious/buggy.json"
dual_condvar         = "tests/e2e/dual_condvar/buggy.json"

# ── Model Definitions ─────────────────────────────────────────
# Uncomment and fill in the models you want to test.
# Each model needs: name, provider, api_key_env, base_url, model_id

[[models]]
name        = "gpt-4o"
provider    = "openai"
model_id    = "gpt-4o"
api_key_env = "OPENAI_API_KEY"          # export OPENAI_API_KEY=sk-...
base_url    = "https://api.openai.com/v1"

[[models]]
name        = "gpt-4o-mini"
provider    = "openai"
model_id    = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"
base_url    = "https://api.openai.com/v1"

[[models]]
name        = "claude-3-5-sonnet"
provider    = "anthropic"
model_id    = "claude-3-5-sonnet-20241022"
api_key_env = "ANTHROPIC_API_KEY"       # export ANTHROPIC_API_KEY=sk-ant-...
base_url    = "https://api.anthropic.com/v1"

[[models]]
name        = "deepseek-v3"
provider    = "openai"                  # DeepSeek uses OpenAI-compatible API
model_id    = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"        # export DEEPSEEK_API_KEY=sk-...
base_url    = "https://api.deepseek.com/v1"

[[models]]
name        = "gemini-1-5-pro"
provider    = "google"
model_id    = "gemini-1.5-pro"
api_key_env = "GOOGLE_API_KEY"          # export GOOGLE_API_KEY=AIza...
base_url    = "https://generativelanguage.googleapis.com/v1beta"

