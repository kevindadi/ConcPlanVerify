# =============================================================================
# How to fill this file (for reproduction)
# -----------------------------------------------------------------------------
# The experiment script calls an OpenAI-compatible Chat Completions HTTP API:
#   POST {base_url}/chat/completions
# with JSON shaped like OpenAI's public schema (messages, model, temperature, …).
#
# For each [[models]] row:
#   name        — Arbitrary label (appears in CSV logs).
#   model_id    — The model string your server expects (provider-specific).
#   api_key_env — Name of an environment variable holding the API key for this row.
#   base_url    — Root URL of that API, almost always ending in /v1 (no trailing
#                 slash after v1). Use your own gateway, campus proxy, or vendor
#                 endpoint as long as it is OpenAI-compatible at that path.
#
# Keys are not stored in this file. Set them before running, e.g.:
#   export ALL_API_KEY="..."
#   export DEEPSEEK_API_KEY="..."
#   export DASHSCOPE_API_KEY="..."
# or put the same lines in a repo-root .env (ignored by git; never upload keys).
#
# The rows below use placeholder base_url values where the original work used
# third-party OpenAI-compatible gateways. Replace them with whatever endpoint
# actually serves the listed model_id for your account. Official first-party
# URLs are kept where the paper used them directly (DeepSeek, DashScope).
# =============================================================================

[experiment]
max_gen_rounds    = 5
max_repair_rounds = 5
temperature       = 0.0
max_tokens        = 4096
patterns_dir      = "tests/e2e"
source_dir        = "experiments/source_programs"
output_dir        = "experiments/results"
runs_per_pattern  = 3

[source_programs]
mutex_deadlock       = "experiments/source_programs/mutex_deadlock.rs"
signal_loss          = "experiments/source_programs/signal_loss.rs"
channel_deadlock     = "experiments/source_programs/channel_deadlock.rs"
three_way_deadlock   = "experiments/source_programs/three_way_deadlock.rs"
semaphore_throttle   = "experiments/source_programs/semaphore_throttle.rs"
cas_race             = "experiments/source_programs/cas_race.rs"
condvar_spurious     = "experiments/source_programs/condvar_spurious.rs"
dual_condvar         = "experiments/source_programs/dual_condvar.rs"
partial_deadlock     = "experiments/source_programs/partial_deadlock.rs"
fn_summary_prop      = "experiments/source_programs/fn_summary_prop.rs"

[buggy_cirs]
mutex_deadlock       = "tests/e2e/mutex_deadlock/buggy.json"
signal_loss          = "tests/e2e/signal_loss/buggy.json"
channel_deadlock     = "tests/e2e/channel_deadlock/buggy.json"
three_way_deadlock   = "tests/e2e/three_way_deadlock/buggy.json"
dual_condvar         = "tests/e2e/dual_condvar/buggy.json"
partial_deadlock     = "tests/e2e/partial_deadlock/buggy.json"

[fixed_cirs]
mutex_deadlock       = "tests/e2e/mutex_deadlock/fixed.json"
channel_deadlock     = "tests/e2e/channel_deadlock/fixed.json"
three_way_deadlock   = "tests/e2e/three_way_deadlock/fixed.json"
semaphore_throttle   = "tests/e2e/semaphore_throttle/buggy.json"
cas_race             = "tests/e2e/cas_race/buggy.json"
dual_condvar         = "tests/e2e/dual_condvar/fixed.json"
partial_deadlock     = "tests/e2e/partial_deadlock/fixed.json"
fn_summary_prop      = "tests/e2e/fn_summary_prop/fixed.json"

# --- Model rows: set base_url (and model_id if your provider uses different ids) ---

[[models]]
name        = "gpt-5"
provider    = "openai"
model_id    = "gpt-5"
api_key_env = "ALL_API_KEY"
base_url    = "https://REPLACE_WITH_YOUR_OPENAI_COMPAT_BASE/v1"

[[models]]
# Prefer a model variant that returns only the final assistant text in
# `message.content` (no hidden reasoning / XML dumped into the same field), so
# the JSON CIR can be parsed without extra stripping.
name        = "claude-4.7-opus"
provider    = "openai"
model_id    = "claude-opus-4-7"
api_key_env = "ALL_API_KEY"
base_url    = "https://REPLACE_WITH_YOUR_OPENAI_COMPAT_BASE/v1"

[[models]]
name        = "gemini-3-pro"
provider    = "openai"
model_id    = "gemini-3-pro"
api_key_env = "ALL_API_KEY"
base_url    = "https://REPLACE_WITH_YOUR_OPENAI_COMPAT_BASE/v1"

[[models]]
name        = "deepseek-v3"
provider    = "openai"
model_id    = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
base_url    = "https://api.deepseek.com/v1"

[[models]]
name        = "qwen3-max"
provider    = "openai"
model_id    = "qwen3-max"
api_key_env = "DASHSCOPE_API_KEY"
base_url    = "https://dashscope.aliyuncs.com/compatible-mode/v1"
