[package]
name = "cpn-gui"
version = "0.1.0"
description = "Tauri desktop for cir2cvn: NL→CIR, CVN analysis, configurable LLM"
edition = "2024"

[lib]
name = "cpn_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
cir2cvn = { path = "../..", features = ["llm"] }
cir = { package = "ceir", path = "../../cir" }
cvn = { path = "../../cvn", features = ["cir-anchor"] }
uni-llm = { path = "../../uni-llm" }
