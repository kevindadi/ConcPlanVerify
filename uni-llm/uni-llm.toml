# uni-llm 配置文件
#
# Default target is the paper's primary model  via the
# z.apiyihe.org OpenAI-compatible aggregator. DashScope is kept for
# the Qwen3-235B-A22B entry.

[default]
provider = "deepseek"
model = "deepseek-v4-flash"
temperature = 0.0
max_tokens = 4096
timeout_secs = 60
max_retries = 3
retry_delay_ms = 1000

# ── DeepSeek first-party API (OpenAI-compatible) ─────────────────
# Direct to DeepSeek instead of through the aggregator for reliability.
[providers.deepseek]
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]

# ── Alibaba Cloud DashScope (OpenAI-compatible) ──────────────────
# Hosts the Qwen3-235B-A22B model used in the paper.
[providers.dashscope]
api_key_env = "DASHSCOPE_API_KEY"
base_url = "https://llm-dr39pykgnr4h1328.cn-beijing.maas.aliyuncs.com/api/v1"
models = ["qwen3.7-flash-2026-07-15"]

# ── Local fallback (optional) ────────────────────────────────────
[providers.ollama]
base_url = "http://localhost:11434/v1"
models = ["llama3", "qwen2", "codestral"]

[fallback]
chain = [
    { provider = "deepseek", model = "deepseek-v4-flash" },
    { provider = "dashscope", model = "qwen3.7-flash-2026-07-15" },
]

[logging]
level = "info"
log_requests = true
log_responses = false
log_to_file = true
log_file = "uni-llm.log"
