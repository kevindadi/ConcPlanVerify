[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cir-workflow"
version = "0.1.0"
description = "Python LLM orchestration for CIR generation and repair"
requires-python = ">=3.10"
dependencies = ["openai>=2,<3"]

[project.scripts]
cir-workflow = "cir_workflow.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cir_workflow*"]
