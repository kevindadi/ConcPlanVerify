[workspace]
members = ["."]
resolver = "2"

[package]
name = "cir2cvn"
version = "0.1.0"
edition = "2024"
description = "Translator from ConcIR (Concurrency Intermediate Representation) to CVN (Concurrency Verification Net)"
license = "MIT"

[features]
default = []

[dependencies]
concir = { git = "https://github.com/kevindadi/ConcIR", rev = "54bda502f27494ac1d6c0cfce36a1ea12f4afee6" }
unipn = { git = "https://github.com/kevindadi/UniPN", rev = "b5afefff61c4c790c9371797c41bc166bc86305e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
