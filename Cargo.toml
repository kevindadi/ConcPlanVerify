[workspace]
members = ["."]
resolver = "2"

[package]
name = "cir2cvn"
version = "0.1.0"
edition = "2024"
description = "Translator from ConcIR (Concurrency Intermediate Representation) to CVN (Concurrency Verification Net)"
license = "MIT"

[features]
default = []

[dependencies]
concir = { git = "https://github.com/kevindadi/ConcIR", branch = "main" }
unipn = { git = "https://github.com/kevindadi/UniPN", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
